# ─────────────────────────────────────────────────────────────────────────────
# General
# ─────────────────────────────────────────────────────────────────────────────
font_size 13
shell_integration no-title
shell /bin/zsh
editor nvim
scrollback_lines 10000
wheel_scroll_multiplier 3.0
copy_on_select yes
strip_trailing_spaces smart
notify_on_cmd_finish never
allow_remote_control yes
mouse_hide_wait	-3.0
enable_audio_bell no
confirm_os_window_close 1
underline_hyperlinks always
listen_on unix:/tmp/kitty

# Window appearance
hide_window_decorations titlebar-only
window_padding_width 1 5 2 2
background_opacity 1
background_blur 0
window_border_width 2px
active_border_color #ff0000
inactive_border_color #665c54
remember_window_size yes
remember_window_position yes

# Tabs and layouts
# Keep `tall` enabled: Kesh uses it for nested pane layouts, and Cmd+R
# otherwise falls back to `splits` when Kitty reloads this config.
enabled_layouts splits:split_axis=horizontal,tall,stack
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
# tab_title_template "{tab.active_wd.rsplit('/', 1)[-1]}"

# ─────────────────────────────────────────────────────────────────────────────
# Keyboard
# ─────────────────────────────────────────────────────────────────────────────
kitty_mod cmd+shift
macos_option_as_alt both
# Make Option+Backspace delete the previous word.
map alt+backspace send_text all \x17

# Config and pane layout
map cmd+r load_config_file
# Cmd+Enter is commonly used by terminal applications to submit actions. Keep
# the layout toggle on the deliberate Cmd+Shift+F chord: returning to `splits`
# can rebuild a nested split tree as three side-by-side columns.
map cmd+shift+f toggle_layout stack
map cmd+shift+r start_resizing_window
# Do not call goto_layout here: re-entering splits rebuilds the existing split
# tree before launching and breaks nested layouts created by tools like kesh.
map cmd+d launch --cwd=current --location=vsplit
map cmd+shift+d launch --cwd=current --location=hsplit
map cmd+t new_tab_with_cwd
map cmd+shift+n set_tab_title
map cmd+shift+backslash toggle_tab title:.*
map cmd+k clear_terminal to_cursor active

# Window navigation
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

# Let Neovim handle split navigation and cross back into Kitty at an edge.
map --when-focus-on var:in_editor ctrl+h
map --when-focus-on var:in_editor ctrl+j
map --when-focus-on var:in_editor ctrl+k
map --when-focus-on var:in_editor ctrl+l

# Window resizing
map cmd+shift+h resize_window wider
map cmd+shift+j resize_window taller
map cmd+shift+k resize_window shorter
map cmd+shift+l resize_window narrower

# ─────────────────────────────────────────────────────────────────────────────
# Kitty sessions (native features Kesh integrates with, not Kesh-specific)
# ─────────────────────────────────────────────────────────────────────────────
# Filter — not group — the tab bar to the active session plus unscoped tabs.
# Kesh tags tabs with a session name via goto_session, so this restricts the
# bar to the session Kesh opened.
tab_bar_filter session:~

# Walk Kitty's global session history back one step (any session, incl. Kesh's).
map cmd+p goto_session -1

# Free Cmd+0..9 for Kesh's pinned-session mappings by putting direct tab
# switching on Ctrl+number instead.
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

# ─────────────────────────────────────────────────────────────────────────────
# Begin Kesh
# ─────────────────────────────────────────────────────────────────────────────
# Stale pins from a previous Kitty run are cleared lazily by the picker itself
# (kesh detects the previous Kitty PID is gone on first launch of each run).

# For pins
# watcher scripts/kesh_clear_pins_on_quit.py

# Session, project, and coding-agent pickers.
# map cmd+shift+o launch --type=overlay --env=KITTY_PICKER_CACHE=1 ~/.config/kitty/scripts/kitty-zoxide-session.sh
map cmd+shift+o launch --type=overlay ~/.local/bin/kesh
map cmd+shift+p launch --type=tab ~/.local/bin/kesh agents

# Pins apply only to the current Kitty run; the picker clears stale pins from a
# previous run on first launch. Keep slots unbound until mappings are generated.
include ~/.local/state/kesh/kitty-pins.conf

# Let the Kesh and project pickers handle Ctrl+J/K instead of moving between panes.
map --when-focus-on title:project-picker ctrl+j
map --when-focus-on title:project-picker ctrl+k
map --when-focus-on title:kesh ctrl+j
map --when-focus-on title:kesh ctrl+k

# ─────────────────────────────────────────────────────────────────────────────
# End Kesh
# ─────────────────────────────────────────────────────────────────────────────

# Cursor
cursor_shape beam
cursor_blink_interval 0
cursor_trail 2
cursor_trail_decay 0.01 0.6
cursor_trail_start_threshold 0

# Scrollback in Neovim
scrollback_pager nvim -u ~/.config/nvim/scrollback.lua +'call nvim_open_term(0, {})' +'set readonly wrap' +'normal! G | if getline(".") ==# "" | normal! k | endif' -
map kitty_mod+up scroll_line_up
map kitty_mod+down scroll_line_down
map kitty_mod+page_up scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home scroll_home
map kitty_mod+end scroll_end
map kitty_mod+z show_scrollback
map cmd+shift+x launch --type=overlay --stdin-source=@screen --stdin-add-formatting nvim -u ~/.config/nvim/scrollback.lua +'call nvim_open_term(0, {})' +'set readonly wrap' +'normal! G | if getline(".") ==# "" | normal! k | endif' -


# Theme: Gruvbox Material Dark Hard
include current-theme.conf


# BEGIN_KITTY_FONTS
font_family      family="CommitMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
