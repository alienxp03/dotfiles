gui:
  sidePanelWidth: 0.2
  # Use one light author color so names stay readable instead of cycling through
  # random colors that become backgrounds when the row is selected.
  authorColors:
    "*": "#e4e4e8"
  theme:
    # Keep the selected row dark and bold so author names remain legible.
    selectedLineBgColor:
      - "#1c1c1c"
      - bold
  # Favor readable author names over commit hashes in the narrow commits panel.
  commitAuthorShortLength: 10
  commitHashLength: 4
keybinding:
  universal:
    quit: q
    quit-alt1: <esc>
    confirmInEditor: [<alt-enter>, <ctrl+s>]
git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --line-numbers
    - colorArg: always
      command: delta --paging=never --line-numbers --side-by-side
customCommands:
  - key: "Y"
    context: "global"
    description: "Switch Delta diff theme"
    prompts:
      - type: "menu"
        title: "Delta diff theme"
        key: "DeltaTheme"
        options:
          - name: "arctic-fox"
            description: "Dark Nord palette"
            value: "arctic-fox"
            key: "a"
          - name: "collared-trogon"
            description: "Dark blue/green palette"
            value: "collared-trogon"
            key: "t"
          - name: "coracias-caudatus"
            description: "Light purple/cyan palette"
            value: "coracias-caudatus"
            key: "r"
          - name: "corvus"
            description: "Dark monochrome palette"
            value: "corvus"
            key: "c"
          - name: "mellow-barbet"
            description: "Dark high-contrast palette"
            value: "mellow-barbet"
            key: "m"
          - name: "villsau"
            description: "Dark syntax palette"
            value: "villsau"
            key: "v"
          - name: "woolly-mammoth"
            description: "Dark green/red palette"
            value: "woolly-mammoth"
            key: "w"
          - name: "zebra-dark"
            description: "Dark muted palette"
            value: "zebra-dark"
            key: "z"
    command: |
      #!/bin/bash
      THEME="{{.Form.DeltaTheme}}"
      git config --global delta.features "$THEME"
      if [ "$THEME" = "coracias-caudatus" ]; then
        git config --global --unset delta.dark 2>/dev/null || true
      else
        git config --global delta.dark true
      fi
      echo "Delta theme: $THEME"
    output: log
  - key: "<c-g>"
    context: "global"
    description: "Review PR diff against the default branch"
    command: |
      BASE=$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null || true)
      if [ -z "$BASE" ]; then
        for candidate in origin/main main origin/master master; do
          if git rev-parse --verify --quiet "$candidate" >/dev/null; then
            BASE="$candidate"
            break
          fi
        done
      fi
      if [ -z "$BASE" ]; then
        echo "Could not determine the default branch. Set origin/HEAD or add main/master."
        exit 1
      fi
      git diff "$BASE...HEAD"
    output: terminal
  - key: "E"
    context: "global"
    command: "git commit --allow-empty -m '{{index .PromptResponses 0}}'"
    prompts:
      - type: "input"
        title: "Empty commit message"
    description: "Create an empty commit"
  - key: "F"
    command: "git pull --rebase origin master"
    context: "localBranches"
    output: log
  - key: "O"
    context: "localBranches"
    description: "Open/Create PR/MR (GitHub/GitLab)"
    command: |
      #!/bin/bash
      REMOTE_URL=$(git remote get-url origin 2>/dev/null || echo "")
      if [[ "$REMOTE_URL" == *"github.com"* ]]; then
        gh pr view --web || gh pr create --web
      elif [[ "$REMOTE_URL" == *"gitlab"* ]]; then
        glab mr view --web || glab mr create --web --fill
      else
        echo "Unknown git provider. Remote URL: $REMOTE_URL"
        exit 1
      fi
  - key: "C"
    context: "files"
    description: "Smart commit with branch prefix"
    prompts:
      - type: "input"
        title: "Enter commit message"
        key: "msg"
    command: |
      #!/bin/bash
      BRANCH=$(git rev-parse --abbrev-ref HEAD)
      TICKET=$(echo "$BRANCH" | grep -oE '[A-Z]+-[0-9]+')
      SERVICE=$(echo "$BRANCH" | cut -d'-' -f3)
      PREFIX="feat: [$TICKET] $SERVICE:"
      echo "Committing with: $PREFIX {{.Form.msg}}"
      git commit -m "$PREFIX {{.Form.msg}}"
  - key: "U"
    context: "commits"
    description: "Undo last commit (keep changes)"
    command: "git reset --soft HEAD~1"
  - key: "<c-n>"
    context: "localBranches"
    description: "Create branch"
    prompts:
      - type: "input"
        title: "Ticket number"
        key: "Ticket"
        initialValue: ""
      - type: "input"
        key: "Service"
        title: "Service"
        initialValue: ""
      - type: "input"
        title: "Message"
        key: "Message"
        initialValue: ""
      - type: "confirm"
        key: "Confirm"
        title: "Commit"
        body: "Create new branch?"
    command: "git checkout -b 'RGPAYM-{{ .Form.Ticket }}-{{.Form.Service}}-{{.Form.Message}}'"
    loadingText: "Creating new branch..."
