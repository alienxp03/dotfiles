onboarding = false

[keys]
prefix = "ctrl+a"

# Side-by-side and stacked panes, matching the tmux bindings.
split_vertical   = "prefix+|"
split_horizontal = "prefix+minus"
zoom             = "prefix+m"

# Cycle through tabs.
previous_tab = "prefix+p"
next_tab     = "prefix+n"

# Cycle through agents.
previous_agent = "prefix+u"
next_agent     = "prefix+d"

# Vim-style space selection in the workspace navigator.
navigate_workspace_up   = "k"
navigate_workspace_down = "j"
navigate_pane_up        = ""
navigate_pane_down      = ""

# Prefix-based pane navigation keeps Ctrl+h/j/k/l available to pane applications.
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

[[keys.command]]
key     = "prefix+shift+l"
type    = "popup"
command = "lazygit"
width   = "90%"
height  = "90%"

[[keys.command]]
key         = "prefix+shift+i"
type        = "popup"
command     = 'printf "Agent name: " >&2 && IFS= read -r name && [ -n "$name" ] && herdr agent rename "$HERDR_ACTIVE_PANE_ID" "$name"'
description = "rename active agent"
width       = 40
height      = 5

[[keys.command]]
key         = "prefix+t"
type        = "popup"
command     = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width       = "80%"
height      = "80%"

[[keys.command]]
key         = "prefix+r"
type        = "popup"
command     = "tuicr --working-tree"
description = "review unstaged changes"
width       = "90%"
height      = "90%"

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode  = "hidden"
pane_borders            = true
pane_gaps               = true
mouse_scroll_lines      = 1

show_agent_labels_on_pane_borders = false
agent_panel_sort = "priority"
[theme]
name = "catppuccin"

[ui.sound]
enabled = false

[worktrees]
directory = "~/Workspace/worktrees"

[experimental]
kitty_graphics = true
